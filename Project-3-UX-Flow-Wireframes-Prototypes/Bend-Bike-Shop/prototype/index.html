<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bend Bike Shop | Rental Prototype</title>
<style>
:root{--green:#245c45;--dark:#18382d;--cream:#f6f7f2;--line:#dce4dd;--muted:#617168;--white:#fff;--warn:#fff4da}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c3027}header{background:var(--white);border-bottom:1px solid var(--line)}.header{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:18px 24px}.logo{font-size:20px;font-weight:800;color:var(--dark)}.logo span{font-size:24px}main{max-width:940px;margin:35px auto 70px;padding:0 18px}.stepbar{display:flex;gap:5px;margin-bottom:25px}.step{height:7px;flex:1;background:#dce5de;border-radius:5px}.step.on{background:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 8px 25px #1c3c2c0a}h1{font-size:clamp(25px,4vw,37px);margin:0 0 10px}h2{font-size:22px;margin:0 0 15px}h3{margin:0 0 10px}.sub{color:var(--muted);margin:0 0 25px;line-height:1.6}.hero{background:linear-gradient(120deg,#e2eee4,#f3f6e9);padding:42px 24px;border-radius:14px;text-align:center;margin-bottom:24px}.hero .bike{font-size:65px}.hero p{margin:8px 0;color:var(--muted)}button{font:inherit;cursor:pointer;border-radius:9px;padding:12px 18px;font-weight:650;border:1px solid var(--green);background:var(--green);color:white}button:hover{filter:brightness(.93)}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:white;color:var(--green)}button.ghost{background:transparent;color:var(--green);border-color:transparent}button.full{width:100%}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:25px;flex-wrap:wrap}.stack{display:grid;gap:12px;max-width:420px;margin:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px}label{font-weight:650;font-size:14px}input,select{width:100%;padding:12px;border:1px solid #b8c7bb;border-radius:9px;font:inherit;background:white;color:#223b2e}input:focus,select:focus{outline:2px solid #75aa88}.notice{background:#edf4ed;border-radius:10px;padding:14px 17px;color:#345441;margin:18px 0}.warning{background:var(--warn)}.error{color:#a4312a;font-size:14px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.bikecard{border:1px solid var(--line);border-radius:14px;padding:18px}.bikecard.selected{border:2px solid var(--green);background:#f1f8f2}.bikepic{height:110px;background:#edf3ed;border-radius:9px;display:grid;place-items:center;font-size:60px;margin-bottom:12px}.bikecard h3{margin:0 0 4px}.bikecard p{margin:5px 0 13px;color:var(--muted)}.bikecard button{width:100%}.summary{border:1px solid var(--line);background:#fafcf9;border-radius:12px;padding:20px;margin-top:20px}.summary .line{display:flex;justify-content:space-between;gap:16px;padding:8px 0}.summary .total{font-weight:800;font-size:20px;border-top:1px solid var(--line);margin-top:10px;padding-top:16px}.checkrow{display:flex;gap:10px;align-items:start;margin:15px 0}.checkrow input{width:auto;margin-top:5px}.waiver{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:20px;background:#fbfcfa;line-height:1.7}.confirmation{text-align:center;background:#edf5ed;padding:28px;border-radius:12px}.confirmation .tick{font-size:45px}.muted{color:var(--muted)}.tag{font-size:12px;color:#54735f;border:1px solid #b7cbb9;border-radius:20px;padding:5px 9px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.hideprint{}@media(max-width:620px){.fields,.cards{grid-template-columns:1fr}.panel{padding:19px}.header{padding:14px 18px}.actions button{flex:1}.hero{padding:24px 12px}}@media print{header,.stepbar,.actions,.hideprint,.footer{display:none!important}main{margin:0;max-width:100%}.panel{box-shadow:none;border:0}}
</style></head><body><header><div class="header"><div class="logo"><span>🚲</span> BEND BIKE SHOP</div><span class="tag">CS 361 Interactive Prototype</span></div></header><main><div id="progress" class="stepbar" aria-label="Reservation progress"></div><div class="panel" id="app" aria-live="polite"></div><div class="footer">Academic prototype only · Fictional inventory, prices, waiver, and payment · No real reservations</div></main>
<script>
'use strict';
const bikes=[{id:'mountain',name:'Mountain Bike',rate:35,desc:'Great for local trails'},{id:'hybrid',name:'Hybrid Bike',rate:25,desc:'Comfortable for city and paths'},{id:'road',name:'Road Bike',rate:40,desc:'Lightweight paved-road option'},{id:'electric',name:'Electric Bike',rate:55,desc:'Extra assistance for longer rides'}];
const steps=['Welcome','Rental Period','Available Bikes','Reservation Details','Liability Waiver','Checkout','Confirmation'];
const key='bend-bike-shop-project3-demo-v1';const initial=()=>({step:0,pickupDate:'',returnDate:'',pickupTime:'09:00',returnTime:'17:00',selected:[],name:'',email:'',phone:'',waiver:false,signature:'',confirmed:false,confirmation:''});
let state;try{state={...initial(),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state=initial()};state.step=Math.max(0,Math.min(6,Number(state.step)||0));
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(key,JSON.stringify(state));const days=()=>{const a=new Date(state.pickupDate+'T12:00:00'),b=new Date(state.returnDate+'T12:00:00');return Math.max(1,Math.round((b-a)/86400000)+1)};const selected=()=>state.selected.map(id=>bikes.find(b=>b.id===id)).filter(Boolean);const total=()=>selected().reduce((s,b)=>s+b.rate*days(),0);const fmt=n=>'$'+n.toFixed(2);
const summary=()=>`<div class="summary"><h3>Rental Summary</h3>${selected().map(b=>`<div class="line"><span>${esc(b.name)} · ${days()} day(s)</span><strong>${fmt(b.rate*days())}</strong></div>`).join('')}<div class="line"><span>Pickup</span><span>${esc(state.pickupDate)} ${esc(state.pickupTime)}</span></div><div class="line"><span>Return</span><span>${esc(state.returnDate)} ${esc(state.returnTime)}</span></div><div class="line total"><span>Total (demo)</span><span>${fmt(total())}</span></div></div>`;
const back=(n)=>`<button class="secondary" data-go="${n}">← Back</button>`;const next=(label='Continue')=>`<button type="submit">${label} →</button>`;
function render(){document.getElementById('progress').innerHTML=steps.map((s,i)=>`<div class="step ${i<=state.step?'on':''}" title="${s}"></div>`).join('');let html='';switch(state.step){
case 0:html=`<div class="hero"><div class="bike">🚴</div><h1>Welcome to Bend Bike Shop</h1><p>Explore Bend with our bicycle rentals</p></div><div class="stack"><button data-go="1">Continue as Guest →</button><button class="secondary" data-action="signin">Sign In (Demo)</button><button class="secondary" data-action="register">Register (Demo)</button></div><div class="notice">This prototype follows Mike's guest rental scenario. Sign-in and registration are demonstration-only options.</div>`;break;
case 1:html=`<h1>Select Your Rental Period</h1><p class="sub">Choose pickup and return dates and times. Demo business hours: 9:00 AM–5:00 PM.</p><form id="form"><div class="fields"><div class="field"><label for="pickupDate">Pickup Date</label><input type="date" id="pickupDate" name="pickupDate" value="${esc(state.pickupDate)}" required></div><div class="field"><label for="pickupTime">Pickup Time</label><select id="pickupTime" name="pickupTime">${times(state.pickupTime)}</select></div><div class="field"><label for="returnDate">Return Date</label><input type="date" id="returnDate" name="returnDate" value="${esc(state.returnDate)}" required></div><div class="field"><label for="returnTime">Return Time</label><select id="returnTime" name="returnTime">${times(state.returnTime)}</select></div></div><p class="error" id="error" role="alert"></p><div class="actions">${back(0)}${next('View Available Bikes')}</div></form>`;break;
case 2:html=`<h1>Available Bikes</h1><p class="sub">Select exactly two bikes for your rental. Inventory and pricing are simulated.</p><div class="notice">${esc(state.pickupDate)} ${esc(state.pickupTime)} → ${esc(state.returnDate)} ${esc(state.returnTime)} · <button class="ghost" data-go="1">Change rental period</button></div><div class="cards">${bikes.map(b=>`<div class="bikecard ${state.selected.includes(b.id)?'selected':''}"><div class="bikepic" aria-hidden="true">🚲</div><h3>${esc(b.name)}</h3><p>${esc(b.desc)}</p><p><strong>${fmt(b.rate)} / day</strong></p><button class="${state.selected.includes(b.id)?'secondary':''}" data-bike="${b.id}" ${!state.selected.includes(b.id)&&state.selected.length>=2?'disabled':''}>${state.selected.includes(b.id)?'✓ Selected — Remove':'Select Bike'}</button></div>`).join('')}</div><div class="notice"><strong>${state.selected.length} of 2 bikes selected</strong>${state.selected.length===2?' · Total: '+fmt(total()):''}</div><div class="actions">${back(1)}<button data-go="3" ${state.selected.length!==2?'disabled':''}>Continue to Reservation Details →</button></div>`;break;
case 3:html=`<h1>Reservation Details</h1><p class="sub">Enter your contact details and review your two-bike reservation.</p><form id="form"><div class="fields"><div class="field"><label for="name">Full Name</label><input id="name" name="name" autocomplete="name" required value="${esc(state.name)}"></div><div class="field"><label for="email">Email Address</label><input id="email" type="email" name="email" autocomplete="email" required value="${esc(state.email)}"></div><div class="field"><label for="phone">Phone Number</label><input id="phone" type="tel" name="phone" autocomplete="tel" required value="${esc(state.phone)}"></div></div>${summary()}<div class="actions">${back(2)}${next('Continue to Liability Waiver')}</div></form>`;break;
case 4:html=`<h1>Rental Agreement & Liability Waiver</h1><p class="sub">Simulation of Bend Bike Shop's existing external waiver service.</p><div class="notice warning"><strong>Demo only:</strong> This is not a real liability waiver or legal agreement. The real shop uses an existing third-party waiver service.</div><div class="waiver"><h3>Prototype Waiver Preview</h3><p>In the production system, the customer would be redirected to the shop's existing waiver provider to review and sign the actual rental agreement and release of liability.</p><p>This prototype demonstrates only the acknowledgment step and return to checkout. No legally binding signature is created.</p></div><form id="form"><label class="checkrow"><input type="checkbox" name="waiver" ${state.waiver?'checked':''} required><span>I acknowledge this simulated waiver step for the classroom prototype.</span></label><div class="field"><label for="signature">Type your name (demo acknowledgment)</label><input id="signature" name="signature" value="${esc(state.signature)}" required></div><div class="actions">${back(3)}${next('Complete Demo Waiver')}</div></form>`;break;
case 5:html=`<h1>Checkout</h1><p class="sub">Review your rental before simulating payment.</p><div class="notice">✓ Demo waiver completed</div>${summary()}<div class="notice warning"><strong>Simulated checkout.</strong> Do not enter real credit card information. Clicking the button creates a mock reservation; no money is charged.</div><div class="actions">${back(4)}<button data-action="pay">Simulate Payment →</button></div>`;break;
case 6:html=`<div class="confirmation"><div class="tick">✓</div><h1>Reservation Confirmed!</h1><p>Thank you for choosing Bend Bike Shop.</p><strong>Confirmation # ${esc(state.confirmation)}</strong></div><div class="summary"><h3>Customer</h3><p>${esc(state.name)} · ${esc(state.email)} · ${esc(state.phone)}</p></div>${summary()}<div class="notice"><strong>Pickup Instructions</strong><p>Visit Bend Bike Shop during business hours at your scheduled pickup time. An employee will verify the reservation and provide the bicycles.</p><p class="muted">This is a mock confirmation; no actual booking was made.</p></div><div class="actions hideprint"><button class="secondary" data-action="print">Print Confirmation</button><button data-action="reset">Start New Reservation →</button></div>`;break;}
app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}
function times(value){return Array.from({length:17},(_,i)=>{const hr=9+Math.floor(i/2),min=i%2?'30':'00',v=String(hr).padStart(2,'0')+':'+min;return `<option value="${v}" ${v===value?'selected':''}>${((hr+11)%12)+1}:${min} ${hr<12?'AM':'PM'}</option>`}).join('')}
function go(n){if(n===3&&state.selected.length!==2)return;if(n===5&&!state.waiver)return;state.step=n;save();render()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined){go(Number(b.dataset.go));return}if(b.dataset.bike){const id=b.dataset.bike;state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):state.selected.length<2?[...state.selected,id]:state.selected;save();render();return}switch(b.dataset.action){case 'signin':case 'register':alert('Account access is outside Mike’s guest checkout scenario. Choose Continue as Guest to test the complete rental flow.');break;case 'pay':state.confirmed=true;state.confirmation='DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase();go(6);break;case 'print':window.print();break;case 'reset':state=initial();save();render();break}});
app.addEventListener('submit',e=>{if(e.target.id!=='form')return;e.preventDefault();const form=e.target,fd=new FormData(form);if(state.step===1){const p=fd.get('pickupDate'),r=fd.get('returnDate'),pt=fd.get('pickupTime'),rt=fd.get('returnTime');const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');if(p<today||r<p||(p===r&&rt<=pt)){document.getElementById('error').textContent='Choose a future or current pickup date and a return time after pickup.';return}Object.assign(state,{pickupDate:p,returnDate:r,pickupTime:pt,returnTime:rt});go(2)}else if(state.step===3){Object.assign(state,{name:fd.get('name').trim(),email:fd.get('email').trim(),phone:fd.get('phone').trim()});go(4)}else if(state.step===4){state.waiver=fd.get('waiver')==='on';state.signature=fd.get('signature').trim();if(!state.waiver||!state.signature)return;go(5)}});
render();
</script></body></html>
